services:
  # PROXY REVERSO E BALANCEADOR DE CARGA (NGINX)
 
  nginx:
    image: nginx:alpine
    container_name: proxy_nginx
    restart: always
    ports:
      # Apenas a porta 80 fica aberta para o ambiente externo (host)
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    networks:
      - rede_votacao


  # INSTÂNCIA 1 DA API (Node.js / Express)

  api1:
    build:
      context: ./backend
    container_name: api_instancia_1
    restart: always
    # Portas 5001 removidas da exposição direta ao host para garantir isolamento
    environment:
      - INSTANCE_NAME=Instancia-1
      - PORT=5000
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=votacao
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    depends_on:
      - db
    networks:
      - rede_votacao

  # ============================================================================
  # INSTÂNCIA 2 DA API (Node.js / Express)
  # ============================================================================
  api2:
    build:
      context: ./backend
    container_name: api_instancia_2
    restart: always
    # Portas 5002 removidas da exposição direta ao host para garantir isolamento
    environment:
      - INSTANCE_NAME=Instancia-2
      - PORT=5000
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=votacao
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    depends_on:
      - db
    networks:
      - rede_votacao

  # ============================================================================
  # BANCO DE DADOS (POSTGRESQL 15)
  # ============================================================================
  db:
    image: postgres:15-alpine
    container_name: db_postgres
    restart: always
    environment:
      - POSTGRES_DB=votacao
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      # Docker Volume para persistência física dos dados do banco
      - pgdata:/var/lib/postgresql/data
      # Script de inicialização executado na primeira subida do banco
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - rede_votacao

# ==============================================================================
# REDE VIRTUAL ISOLADA (DOCKER NETWORK)
# ==============================================================================
networks:
  rede_votacao:
    driver: bridge
    name: rede_votacao

# ==============================================================================
# ARMAZENAMENTO PERSISTENTE (DOCKER VOLUME)
# ==============================================================================
volumes:
  pgdata:
    driver: local
    name: pgdata
