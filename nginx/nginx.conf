events {
    worker_connections 1024; #numero max de conexoes(no nosso caso, votos) que o nginx  suporta. ALTERAR QUANDO FOR EXECUTAR TESTES MAIORES. Deixar isso muito alto pode estorar a RAM e chegar nos limites do hardware.
}

http {
    # Diretivas básicas de rede e desempenho
    sendfile on; #evita a cpu e vai direto pro hardware, deixa mais rapido
    tcp_nopush on; 
    tcp_nodelay on;# tira o delay padrao de cada requisição, deixando supostamente instantaneo
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Definição do grupo de servidores upstream (APIs de backend)
    upstream simulador_votacao {
        least_conn; # ativa o algoritmo de balaceamento
        # porta / max de tentativas que pode falhar / tempo
        server api1:5000 max_fails=3 fail_timeout=5s;
        server api2:5000 max_fails=3 fail_timeout=5s;

        keepalive 32; # numero max de conexoes abertas para reuso, esse numero ai é mais boa pratica que qualquer outra coisa
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            # Encaminhamento para o pool upstream
            proxy_pass http://simulador_votacao;

            # Otimização de transporte HTTP/1.1 para suporte a keepalive com o upstream
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Preservação de cabeçalhos de origem do cliente
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Tolerância a falhas e timeouts de conexão
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }
    }
}
