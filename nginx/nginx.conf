events {
    worker_connections 1024;
}

http {
    # Diretivas básicas de rede e desempenho
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Definição do grupo de servidores upstream (APIs de backend)
    upstream simulador_votacao {
        # ====================================================================
        # ALGORITMO DE BALANCEAMENTO: Least Connections (least_conn)
        # ====================================================================
        # Redireciona cada nova requisição para a réplica com menor número de
        # conexões ativas no momento, mitigando gargalos quando os tempos de
        # resposta das requisições flutuam (ex.: concorrência de I/O de banco).
        least_conn;

        # --------------------------------------------------------------------
        # NOTA DE COMPARAÇÃO / ROUND-ROBIN (BASELINE):
        # Para operar com o algoritmo padrão Round-Robin (fila indiana uniforme),
        # basta comentar a linha 'least_conn;' acima. O Nginx utiliza Round-Robin
        # como estratégia default na ausência de diretiva específica.
        # --------------------------------------------------------------------

        # Instâncias de backend registradas na rede interna do Docker (porta 5000)
        # max_fails e fail_timeout garantem remoção ágil de instâncias com falha
        server api1:5000 max_fails=3 fail_timeout=5s;
        server api2:5000 max_fails=3 fail_timeout=5s;

        # Reaproveitamento de conexões TCP estabelecidas (keepalive)
        keepalive 32;
    }

    server {
        # Porta externa do Proxy Reverso exposta para clientes e testes
        listen 80;
        server_name localhost;

        location / {
            # Encaminhamento para o pool upstream
            proxy_pass http://simulador_votacao;

            # Otimização de transporte HTTP/1.1 para suporte a keepalive com o upstream
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Preservação de cabeçalhos de origem do cliente
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Tolerância a falhas e timeouts de conexão
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }
    }
}
